name: Price Check

# NOTA: la schedulazione automatica è gestita dal Cloudflare Worker
# (cron ogni 15 min) per aggirare il blocco IP di Amazon sui runner di
# GitHub Actions. Questo workflow resta come fallback manuale.
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Forza il check ignorando l'intervallo"
        required: false
        default: "false"

permissions:
  contents: write # necessario per fare commit di products.json

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run price check
        env:
          TELEGRAM_BOT: ${{ secrets.TELEGRAM_BOT }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          FORCE_CHECK: ${{ github.event.inputs.force }}
        run: python price_check.py
